<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>飘带彩带 Canvas 原型 · 独立测试</title>
  <style>
    :root {
      --bg: #0b1220;
      --text: #e5e7eb;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header {
      padding: 16px 18px 8px;
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.25rem;
      font-weight: 750;
      letter-spacing: -0.02em;
    }
    p { margin: 0 0 8px; color: var(--muted); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 12px 0 4px;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(180deg, #fcd34d, #f59e0b);
      color: #111827;
    }
    button.secondary {
      background: #1f2937;
      color: var(--text);
      border: 1px solid #334155;
    }
    .meta { font-size: 12px; color: var(--muted); }
    .stage-wrap {
      position: relative;
      width: min(92vw, 560px);
      height: min(92vw, 560px);
      margin: 12px auto 24px;
      border-radius: 16px;
      background:
        linear-gradient(45deg, #1e293b 25%, transparent 25%) 0 0 / 20px 20px,
        linear-gradient(-45deg, #1e293b 25%, transparent 25%) 0 10px / 20px 20px,
        linear-gradient(45deg, transparent 75%, #1e293b 75%) 10px -10px / 20px 20px,
        linear-gradient(-45deg, transparent 75%, #1e293b 75%) -10px 0 / 20px 20px,
        #0f172a;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.2), 0 20px 50px rgba(0,0,0,0.45);
    }
    .stage-wrap .label {
      position: absolute;
      left: 10px;
      top: 10px;
      z-index: 2;
      font-size: 11px;
      color: #94a3b8;
      pointer-events: none;
    }
    #host {
      width: 100%;
      height: 100%;
    }
    .light-stage {
      background: #f8fafc;
      box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.35);
    }
    .light-stage .label { color: #64748b; }
  </style>
</head>
<body>
  <header>
    <h1>飘带彩带 · Canvas 独立原型</h1>
    <p>8–14 条金色长卷曲丝带 + 少量星芒；约 2s 展开→飘落→淡出。不覆盖正式 WebP。</p>
    <div class="toolbar">
      <button type="button" id="btnPlay">播放</button>
      <button type="button" class="secondary" id="btnLight">浅色底验收</button>
      <span class="meta" id="log">就绪</span>
    </div>
  </header>
  <div class="stage-wrap" id="stageWrap">
    <div class="label">透明棋盘仅测试页 · 画布本身透明</div>
    <div id="host"></div>
  </div>
  <script src="./icons/fx/_proto_ribbon_confetti/ribbon-confetti-canvas.js?v=20261026r3"></script>
  <script>
    (function () {
      var host = document.getElementById("host");
      var logEl = document.getElementById("log");
      var stageWrap = document.getElementById("stageWrap");
      var ctl = null;
      function play() {
        if (!window.FxProtoRibbonConfetti) {
          logEl.textContent = "模块未加载";
          return;
        }
        if (ctl) {
          try { ctl.destroy(); } catch (_d) {}
          ctl = null;
        }
        host.replaceChildren();
        var side = Math.round(Math.min(host.getBoundingClientRect().width || 512, 560));
        ctl = window.FxProtoRibbonConfetti.mount(host, {
          sizeCss: side,
          fillHost: true,
          durationMs: 2016,
          ribbonCount: 11,
          starCount: 8,
          sparkCount: 14
        });
        var t0 = performance.now();
        logEl.textContent = "播放中…";
        ctl.play().then(function () {
          logEl.textContent = "结束 · " + Math.round(performance.now() - t0) + "ms";
        });
      }
      document.getElementById("btnPlay").addEventListener("click", play);
      document.getElementById("btnLight").addEventListener("click", function () {
        stageWrap.classList.toggle("light-stage");
        play();
      });
      play();
    })();
  </script>
</body>
</html>
