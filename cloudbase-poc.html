<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CloudBase POC 测试页（非 Kinetic PWA）</title>
  <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.32.0/cloudbase.full.js"></script>
  <style>
    :root {
      --bg: #f0f4f3;
      --card: #fff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #dbe3e0;
      --ok: #15803d;
      --warn: #b45309;
      --err: #b91c1c;
      --accent: #0f766e;
      --mono: ui-monospace, Menlo, Consolas, monospace;
      --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--text);
      background: linear-gradient(180deg, #d9efe9 0%, var(--bg) 220px);
      min-height: 100vh;
      padding: 16px;
    }
    main { max-width: 640px; margin: 0 auto; display: grid; gap: 12px; }
    .banner {
      background: #0f766e;
      color: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      font-weight: 700;
      line-height: 1.35;
    }
    .banner small { display: block; font-weight: 500; opacity: 0.9; margin-top: 4px; }
    section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
    }
    h2 { margin: 0 0 10px; font-size: 0.95rem; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 10px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.92rem;
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
    .kv {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      background: #fafbfc;
    }
    .kv .k { display: block; font-size: 0.72rem; color: var(--muted); }
    .kv .v { font-family: var(--mono); font-size: 0.9rem; word-break: break-all; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .ok { background: #dcfce7; color: var(--ok); }
    .warn { background: #ffedd5; color: var(--warn); }
    .err { background: #fee2e2; color: var(--err); }
    .idle { background: #e2e8f0; color: #475569; }
    #errorLog {
      margin: 0;
      max-height: 200px;
      overflow: auto;
      font-family: var(--mono);
      font-size: 0.72rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      background: #0b1220;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      min-height: 64px;
    }
  </style>
</head>
<body>
  <main>
    <div class="banner">
      CloudBase POC 测试页 · v2026-09-22c
      <small>这不是 Kinetic Execution 正式 PWA · 文件名 cloudbase-poc.html · 正常大小约 18KB（不是 0B）</small>
    </div>

    <section>
      <h2>登录</h2>
      <label for="username">用户名</label>
      <input id="username" type="text" autocomplete="username" />
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password" />
      <div class="row">
        <button type="button" class="primary" id="btnLogin">登录并开始 watch</button>
        <button type="button" id="btnLogout" disabled>退出</button>
      </div>
    </section>

    <section>
      <h2>状态</h2>
      <div class="grid">
        <div class="kv"><span class="k">登录状态</span><span class="v" id="loginStatus"><span class="badge idle">未登录</span></span></div>
        <div class="kv"><span class="k">watch 连接状态</span><span class="v" id="watchStatus"><span class="badge idle">未连接</span></span></div>
        <div class="kv"><span class="k">当前 value</span><span class="v" id="curValue">—</span></div>
        <div class="kv"><span class="k">最后修改设备</span><span class="v" id="curDevice">—</span></div>
        <div class="kv"><span class="k">实时延迟</span><span class="v" id="curLatency">—</span></div>
        <div class="kv"><span class="k">watch 回调次数</span><span class="v" id="watchCount">0</span></div>
      </div>
    </section>

    <section>
      <h2>写入</h2>
      <div class="row">
        <button type="button" class="primary" id="btnInc" disabled>value +1</button>
        <button type="button" id="btnDesktop" disabled>发送电脑测试</button>
        <button type="button" id="btnMobile" disabled>发送手机测试</button>
      </div>
    </section>

    <section>
      <h2>event-loop lag（约每秒）</h2>
      <div class="grid">
        <div class="kv"><span class="k">p50</span><span class="v" id="lagP50">—</span></div>
        <div class="kv"><span class="k">p95</span><span class="v" id="lagP95">—</span></div>
        <div class="kv"><span class="k">max</span><span class="v" id="lagMax">—</span></div>
      </div>
    </section>

    <section>
      <h2>错误日志</h2>
      <pre id="errorLog">（暂无）</pre>
      <div class="row" style="margin-top:8px">
        <button type="button" id="btnClearLog">清空日志</button>
      </div>
    </section>
  </main>

  <script>
(function () {
  "use strict";

  var ENV_ID = "kinetic-sync-test-d8d0161a4ba1f4";
  var REGION = "ap-shanghai";
  var COLLECTION = "sync_test";
  var ROOM_ID = "poc-room";

  var app = null;
  var auth = null;
  var db = null;
  var watcher = null;
  var docId = null;
  var writing = false;
  var watchCallbackCount = 0;
  var lastKnownSeq = 0;
  var errorLines = [];

  var el = {
    username: document.getElementById("username"),
    password: document.getElementById("password"),
    btnLogin: document.getElementById("btnLogin"),
    btnLogout: document.getElementById("btnLogout"),
    btnInc: document.getElementById("btnInc"),
    btnDesktop: document.getElementById("btnDesktop"),
    btnMobile: document.getElementById("btnMobile"),
    btnClearLog: document.getElementById("btnClearLog"),
    loginStatus: document.getElementById("loginStatus"),
    watchStatus: document.getElementById("watchStatus"),
    curValue: document.getElementById("curValue"),
    curDevice: document.getElementById("curDevice"),
    curLatency: document.getElementById("curLatency"),
    watchCount: document.getElementById("watchCount"),
    errorLog: document.getElementById("errorLog"),
    lagP50: document.getElementById("lagP50"),
    lagP95: document.getElementById("lagP95"),
    lagMax: document.getElementById("lagMax")
  };

  function detectDeviceLabel() {
    var ua = navigator.userAgent || "";
    var coarse = false;
    try {
      coarse = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
    } catch (e) {}
    if (/Android|iPhone|iPad|iPod|Mobile/i.test(ua) || coarse) return "mobile";
    return "desktop";
  }

  var localDevice = detectDeviceLabel();

  function badge(text, kind) {
    return '<span class="badge ' + kind + '">' + text + "</span>";
  }

  function setLoginStatus(text, kind) {
    el.loginStatus.innerHTML = badge(text, kind);
  }

  function setWatchStatus(text, kind) {
    el.watchStatus.innerHTML = badge(text, kind);
  }

  function pushLogLines(lines) {
    for (var i = 0; i < lines.length; i++) errorLines.push(lines[i]);
    if (errorLines.length > 120) errorLines = errorLines.slice(-120);
    el.errorLog.textContent = errorLines.join("\n");
  }

  function safeJson(value) {
    try {
      return JSON.stringify(value, null, 2);
    } catch (e) {
      try {
        return String(value);
      } catch (e2) {
        return "[无法序列化]";
      }
    }
  }

  /** 从 CloudBase / 浏览器错误对象提取可读字段 */
  function extractErrorFields(err) {
    var fields = {
      code: "",
      message: "",
      category: "",
      origin: String(location.origin || ""),
      raw: ""
    };
    if (err == null) {
      fields.message = "(无错误对象)";
      return fields;
    }
    if (typeof err === "string") {
      fields.message = err;
      fields.raw = err;
      return fields;
    }

    fields.code = String(
      err.code ||
      err.error ||
      err.error_code ||
      err.errorCode ||
      (err.data && (err.data.code || err.data.error || err.data.error_code)) ||
      ""
    );
    fields.message = String(
      err.message ||
      err.msg ||
      err.error_description ||
      err.description ||
      (err.data && (err.data.message || err.data.msg || err.data.error_description)) ||
      ""
    );
    fields.category = String(
      err.category ||
      err.error_category ||
      (err.data && (err.data.category || err.data.error_category)) ||
      ""
    );
    fields.raw = safeJson(err);

    // 部分 SDK 把细节挂在 error / response 上
    if (!fields.message && err.error && typeof err.error === "object") {
      var nested = extractErrorFields(err.error);
      if (!fields.code) fields.code = nested.code;
      if (!fields.message) fields.message = nested.message;
      if (!fields.category) fields.category = nested.category;
    }
    return fields;
  }

  function isCorsPermissionDenied(fields, err) {
    var blob = (
      (fields.code || "") + " " +
      (fields.message || "") + " " +
      (fields.category || "") + " " +
      (fields.raw || "") + " " +
      String(err || "")
    ).toLowerCase();
    return (
      blob.indexOf("cors") >= 0 ||
      blob.indexOf("permission denied") >= 0 ||
      blob.indexOf("not in domain list") >= 0 ||
      blob.indexOf("unauthorized origin") >= 0 ||
      blob.indexOf("origin not allowed") >= 0 ||
      blob.indexOf("安全域名") >= 0
    );
  }

  function logError(msg, err) {
    var stamp = new Date().toISOString();
    var lines = [stamp + "  " + msg];
    if (err != null) {
      var f = extractErrorFields(err);
      lines.push("  code: " + (f.code || "(无)"));
      lines.push("  message: " + (f.message || "(无)"));
      if (f.category) lines.push("  category: " + f.category);
      lines.push("  origin: " + f.origin);
      lines.push("  raw: " + f.raw);
    }
    pushLogLines(lines);
    console.warn(msg, err || "");
  }

  /** 登录失败：完整错误 + 常见诊断提示 */
  function logLoginFailure(err) {
    var stamp = new Date().toISOString();
    var f = extractErrorFields(err);
    var lines = [
      stamp + "  登录失败（完整错误）",
      "  code: " + (f.code || "(无)"),
      "  message: " + (f.message || "(无)"),
      "  category: " + (f.category || "(无)"),
      "  origin: " + f.origin
    ];

    if (isCorsPermissionDenied(f, err)) {
      lines.push("  诊断: 安全域名未放行");
      lines.push("  说明: 请把当前 origin 加到 CloudBase 控制台 → 环境设置 → 安全配置 → 网页安全域名");
    }

    // 常见 Auth 错误原样保留 code/message，并加一行提示标签（不遮盖原文）
    var codeLower = String(f.code || "").toLowerCase();
    var msgLower = String(f.message || "").toLowerCase();
    var known = [
      "invalid_password",
      "user_pending",
      "client not found",
      "client_not_found",
      "provider not enabled",
      "provider_not_enabled"
    ];
    for (var i = 0; i < known.length; i++) {
      var k = known[i];
      if (codeLower.indexOf(k) >= 0 || msgLower.indexOf(k) >= 0) {
        lines.push("  匹配: " + k + "（见上方 code/message 原文）");
        break;
      }
    }

    lines.push("  raw: " + f.raw);
    pushLogLines(lines);
    console.warn("登录失败", err || "");

    // 状态徽章也带上 code，避免只显示「登录失败」
    var badgeText = "登录失败";
    if (isCorsPermissionDenied(f, err)) badgeText = "登录失败·安全域名未放行";
    else if (f.code) badgeText = "登录失败·" + f.code;
    else if (f.message) badgeText = "登录失败·" + String(f.message).slice(0, 24);
    setLoginStatus(badgeText, "err");
  }

  function setActionsEnabled(on) {
    el.btnInc.disabled = !on;
    el.btnDesktop.disabled = !on;
    el.btnMobile.disabled = !on;
  }

  function applyDocToUi(doc) {
    if (!doc) return;
    if (doc._id) docId = doc._id;
    el.curValue.textContent = doc.value == null ? "—" : String(doc.value);
    el.curDevice.textContent = doc.device != null ? String(doc.device) : "—";
    if (typeof doc.seq === "number") lastKnownSeq = doc.seq;
    if (typeof doc.sentAt === "number") {
      el.curLatency.textContent = (Date.now() - doc.sentAt) + " ms";
    } else {
      el.curLatency.textContent = "—";
    }
  }

  function initSdk() {
    if (typeof cloudbase === "undefined") {
      throw new Error("CloudBase SDK 未加载");
    }
    app = cloudbase.init({
      env: ENV_ID,
      region: REGION,
      clientId: ENV_ID
    });
    auth = app.auth({ persistence: "local" });
    db = app.database();
  }

  async function ensureRoomDoc() {
    var res = await db.collection(COLLECTION).where({ room: ROOM_ID }).limit(1).get();
    var docs = (res && res.data) || [];
    if (docs.length) return docs[0];

    var payload = {
      room: ROOM_ID,
      value: 0,
      device: localDevice,
      sentAt: Date.now(),
      seq: 0,
      createdAt: Date.now(),
      note: "cloudbase-poc"
    };
    var addRes = await db.collection(COLLECTION).add(payload);
    var newId = addRes && (addRes.id || addRes._id);
    if (!newId) {
      var again = await db.collection(COLLECTION).where({ room: ROOM_ID }).limit(1).get();
      var againDocs = (again && again.data) || [];
      if (!againDocs.length) throw new Error("创建 poc-room 后无法读回");
      return againDocs[0];
    }
    payload._id = newId;
    return payload;
  }

  async function closeWatcher() {
    if (!watcher) return;
    try {
      if (typeof watcher.close === "function") {
        var ret = watcher.close();
        if (ret && typeof ret.then === "function") await ret;
      }
    } catch (e) {
      logError("关闭 watch 失败", e);
    }
    watcher = null;
  }

  function startWatch() {
    setWatchStatus("连接中…", "warn");
    watcher = db.collection(COLLECTION).where({ room: ROOM_ID }).watch({
      onChange: function (snapshot) {
        watchCallbackCount += 1;
        el.watchCount.textContent = String(watchCallbackCount);
        setWatchStatus("已连接", "ok");

        var docs = (snapshot && snapshot.docs) || [];
        if (!docs.length && snapshot && snapshot.docChanges) {
          var changes = snapshot.docChanges || [];
          for (var i = changes.length - 1; i >= 0; i--) {
            if (changes[i] && changes[i].doc) {
              docs = [changes[i].doc];
              break;
            }
          }
        }
        if (!docs.length) {
          logError("watch 回调无文档", snapshot);
          return;
        }

        var best = docs[0];
        for (var j = 1; j < docs.length; j++) {
          var a = typeof best.seq === "number" ? best.seq : -1;
          var b = typeof docs[j].seq === "number" ? docs[j].seq : -1;
          if (b >= a) best = docs[j];
        }
        applyDocToUi(best);
      },
      onError: function (err) {
        setWatchStatus("错误", "err");
        logError("watch onError", err);
      }
    });
  }

  async function writeUpdate(deviceLabel) {
    if (!docId || writing) return;
    writing = true;
    setActionsEnabled(false);
    try {
      var curNum = Number(el.curValue.textContent);
      if (!Number.isFinite(curNum)) curNum = 0;
      var nextValue = curNum + 1;
      var nextSeq = (typeof lastKnownSeq === "number" ? lastKnownSeq : 0) + 1;
      var patch = {
        value: nextValue,
        device: deviceLabel,
        sentAt: Date.now(),
        seq: nextSeq
      };
      await db.collection(COLLECTION).doc(docId).update(patch);
      lastKnownSeq = nextSeq;
      el.curValue.textContent = String(nextValue);
      el.curDevice.textContent = deviceLabel;
    } catch (e) {
      logError("写入失败", e);
    } finally {
      writing = false;
      setActionsEnabled(!!docId);
    }
  }

  async function onLogin() {
    var username = String(el.username.value || "").trim();
    var password = String(el.password.value || "");
    if (!username || !password) {
      logError("请输入用户名和密码");
      return;
    }
    el.btnLogin.disabled = true;
    setLoginStatus("登录中…", "warn");
    setWatchStatus("未连接", "idle");
    try {
      if (!app) initSdk();
      await closeWatcher();
      await auth.signIn({ username: username, password: password });
      el.password.value = "";
      setLoginStatus("已登录 · " + username, "ok");
      el.btnLogout.disabled = false;
      var doc = await ensureRoomDoc();
      applyDocToUi(doc);
      startWatch();
      setActionsEnabled(true);
    } catch (e) {
      setWatchStatus("未连接", "idle");
      setActionsEnabled(false);
      logLoginFailure(e);
    } finally {
      el.btnLogin.disabled = false;
    }
  }

  async function onLogout() {
    try {
      await closeWatcher();
      if (auth && typeof auth.signOut === "function") await auth.signOut();
    } catch (e) {
      logError("退出失败", e);
    }
    docId = null;
    lastKnownSeq = 0;
    el.curValue.textContent = "—";
    el.curDevice.textContent = "—";
    el.curLatency.textContent = "—";
    setLoginStatus("未登录", "idle");
    setWatchStatus("未连接", "idle");
    setActionsEnabled(false);
    el.btnLogout.disabled = true;
    el.password.value = "";
  }

  (function startLagProbe() {
    var samples = [];
    var intervalMs = 50;
    var expected = performance.now() + intervalMs;
    var lastReport = performance.now();

    function percentile(sorted, p) {
      if (!sorted.length) return 0;
      var idx = Math.min(sorted.length - 1, Math.ceil((p / 100) * sorted.length) - 1);
      if (idx < 0) idx = 0;
      return sorted[idx];
    }

    function report() {
      if (!samples.length) {
        el.lagP50.textContent = "—";
        el.lagP95.textContent = "—";
        el.lagMax.textContent = "—";
        return;
      }
      var sorted = samples.slice().sort(function (a, b) { return a - b; });
      el.lagP50.textContent = percentile(sorted, 50).toFixed(1) + " ms";
      el.lagP95.textContent = percentile(sorted, 95).toFixed(1) + " ms";
      el.lagMax.textContent = sorted[sorted.length - 1].toFixed(1) + " ms";
      samples = [];
    }

    function tick() {
      var now = performance.now();
      var lag = now - expected;
      if (lag < 0) lag = 0;
      samples.push(lag);
      expected += intervalMs;
      if (now - expected > intervalMs * 5) expected = now + intervalMs;
      if (now - lastReport >= 1000) {
        lastReport = now;
        report();
      }
      setTimeout(tick, intervalMs);
    }
    setTimeout(tick, intervalMs);
  })();

  el.btnLogin.addEventListener("click", function () { onLogin(); });
  el.btnLogout.addEventListener("click", function () { onLogout(); });
  el.btnInc.addEventListener("click", function () { writeUpdate(localDevice); });
  el.btnDesktop.addEventListener("click", function () { writeUpdate("desktop-test"); });
  el.btnMobile.addEventListener("click", function () { writeUpdate("mobile-test"); });
  el.btnClearLog.addEventListener("click", function () {
    errorLines = [];
    el.errorLog.textContent = "（暂无）";
  });
  el.password.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter") onLogin();
  });

  try {
    initSdk();
  } catch (e) {
    setLoginStatus("SDK 失败", "err");
    logError("初始化 SDK 失败", e);
  }
})();
  </script>
</body>
</html>
